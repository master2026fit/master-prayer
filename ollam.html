<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성경153올람편지</title><style>body{font:17px/1.85 system-ui,sans-serif;background:#f7f5ef;color:#26332e;max-width:740px;margin:auto;padding:20px}button,input,textarea{font:inherit;padding:9px;border:1px solid #b8c7bd;border-radius:9px}button{background:white;color:#254d3b;cursor:pointer}input,textarea{box-sizing:border-box;width:100%}article{background:white;padding:20px;border-radius:14px;margin:15px 0}p{white-space:pre-wrap}nav{display:flex;gap:8px;flex-wrap:wrap}h1,h2,h3{line-height:1.4}#results button{display:block;width:100%;text-align:left;margin:6px 0}small{color:#53665b}</style><h1>성경153올람편지</h1><small>1~10편 시험판 · 원문 및 묵상</small><input id="q" placeholder="번호 · 제목 · 성경 검색"><div id="results"></div><article id="detail"></article><nav><button id="prev">이전 편</button><button id="next">다음 편</button><button onclick="window.scrollTo(0,0)">목록으로</button></nav><script>const data=[{"expected_number": 1, "title": "태초에 하나님이 천지를 창조하시니라", "scripture": "창세기 1:1~5", "body": "우리는 지금 여기에 존재하고 있습니다. 이것은 엄연한 사실이자 진리이기까지 합니다. 이것이 확실하다면 이제 우리는 나의 존재양식에 대해 깊이 생각해 보아야 합니다. 나는 어디로부터 왔는지, 내가 지금 여기에 존재하고 있는 것은 무슨 의미가 있는지, 그리고 나는 어디로 가는지 우리는 깊이 고민해 보아야 합니다. 왜냐하면 지금 여기에 있는 나의 삶은 오직 한 번밖에 없는 삶이요, 다시 반복할 수 없는 너무나 소중한 인생이기 때문입니다.\n\n이 세상 모든 것의 존재에 대하여 진화론적 입장이 있습니다. 그러나 이 입장은 우주의 시작, 생명체의 기원, 생물의 진화 등에 대하여 뚜렷한 증거를 제시할 수 없어 과학적 추론만 할 뿐이고, 그래서 이 모든 것이 존재하게 된 것에 대하여 그냥 ‘우연히’ 그렇게 되었다고 설명하고 있습니다. 그러나 성경은 만물의 기원과 생명의 출현에 대하여 “태초에 하나님이 천지를 창조하시니라” (창1:1)라고 분명히 선언하고 있습니다. 하나님은 말씀으로 천지만물을 창조하시고, 각기 종류대로 생물을 만드셨습니다. 그리고 바로 내가 지금 여기에 존재하고 있는 것도 결국은 하나님의 창조의 결과입니다.\n\n이 세상 모든 사람들은 두 가지의 가치관 중에 한 가지를 선택하여 살아갈 수밖에 없습니다. 하나는 우연의 가치관이요, 하나는 창조의 가치관입니다. 우연의 가치관은 진화론에 맞닿아 있고, 창조의 가치관은 창조신앙에 맞닿아 있습니다. 나는 내 인생을 우연의 가치관에 맡길 수가 없습니다. 나는 절대로 우연히 있게 된 존재가 아닙니다. 하나님은 창세전부터 나를 예정하셔서 지금 여기에 나를 있게 만들어주신 것입니다. 사람은 자기의 가치관대로 살아갑니다. 창조의 가치관으로 정말 아름답고 보람된 삶을 꼭 살아가시기를 바랍니다.", "reflection": {"case": "퇴직이나 일의 실패로 내가 쓸모없는 사람처럼 느껴질 때, 성과가 아니라 하나님이 지으신 존재라는 믿음으로 자신을 바라봅니다.", "question": "최근 내 가치를 성과나 다른 사람의 평가로 판단한 순간은 언제였습니까?", "answer": "일이 뜻대로 되지 않아 하루를 낭비했다고 생각했습니다. 그러나 오늘도 가족에게 따뜻하게 말하고 맡은 일을 성실히 하는 삶에는 의미가 있음을 기억하겠습니다.", "practice": "오늘 감사한 일 세 가지를 기록하고 가족 한 사람에게 감사의 말을 전합니다.", "prayer": "창조주 하나님, 제 삶을 귀하게 여기고 주어진 하루를 감사와 사랑으로 살아가게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 2, "title": "하나님이 보시기에 심히 좋았더라", "scripture": "창세기 1:26~31", "body": "사람이 살아갈 때 가장 중요한 것은 내가 어떤 존재인가를 인식하는 것입니다. 이렇게 자기 존재인식을 한 사람만이 건강한 존재양식을 갖고 아름다운 삶을 살아갈 수 있게 되는 것입니다. 그렇다면 여러분은 자기 자신에 대해 어떤 존재인식을 갖고, 나아가 어떤 존재양식으로 살아가고 있습니까? 바로 이 질문에 대하여 그 대답은 두 가지로 나누어질 수밖에 없습니다. 하나는 우연의 존재양식이요, 또 하나는 창조의 존재양식입니다.\n\n많은 사람들이 우주의 기원이나 생명의 출현 등 과학이 도저히 설명할 수 없는 것조차도 ‘과학적’이라고 주장하며 모든 삶에 있어 우연의 존재양식으로 살아갑니다. 그러나 창조 신앙을 가진 사람들은 하나님이 이 모든 우주만물을 만드셨으며, 모든 생물을 그 종류대로 만드셨고, 오늘의 나까지 만들어주셨다고 믿으며 창조의 존재양식을 갖고 살아갑니다. 우리는 결코 우연히 이 세상에 왔다가 우연히 소멸해가는 존재가 아닙니다.\n\n하나님은 창조 때에 인간을 특별하게 만드셨는데, 첫째는 하나님을 닮은 존재로, 둘째는 하나님께 복 받은 존재로, 셋째는 하나님께 긍정적인 존재로, 넷째는 하나님께 사랑받는 존재로 만들어 주셨습니다. 이 사실은 지금 나라고 하는 존재가 얼마나 대단한 존재인지를 알려주는 새로운 존재인식입니다. 이제 이 존재인식을 가지고, 전혀 새로운 존재양식을 확정하여, 진정으로 아름다운 삶을 살아가는 여러분이 되시기를 간절히 기원합니다.", "reflection": {"case": "교회에서 봉사를 마쳤는데 아무도 알아주지 않고 다른 사람만 칭찬받아 서운합니다. 인정받지 못하면 내 가치도 낮아진다고 생각하는 대신 하나님께 사랑받는 존재라는 말씀을 기억하고, 다른 봉사자의 수고도 인정해 봅니다.", "question": "나는 다른 사람의 인정이나 성과에 따라 내 가치를 판단한 적이 있습니까? 그때 상대에게 어떻게 행동했습니까?", "answer": "다른 사람이 칭찬받자 서운해서 인사도 건성으로 했습니다. 하나님께 사랑받는 존재라는 사실을 기억하고, 상대의 수고를 진심으로 인정하겠습니다.", "practice": "오늘 비교하는 마음이 들 때 그 상황을 기록하고, 상대방에게 구체적인 칭찬 한마디를 건넵니다.", "prayer": "하나님, 저를 주님의 형상대로 지으시고 사랑해 주심에 감사합니다. 사람의 평가에 매이지 않고 저 자신과 이웃을 귀하게 여기며 살아가게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 3, "title": "둘이 한 몸을 이룰지로다", "scripture": "창세기 2:18~25", "body": "이 세상 78억이 넘는 사람들 가운데서 어떤 업종, 어떤 모임, 어떤 일을 막론하고 사람들이 가장 많이 종사하는 일은 바로 결혼과 가정입니다. 그래서 하나님은 가장 먼저 가정을 만드신 것이고, 이 가정을 통해 창조의 역사를 계속 이어나가시기로 작정하신 것입니다.\n\n첫 번 결혼식에서 하나님께서 말씀해주신 첫 번 주례사는 “이러므로 남자가 부모를 떠나 그의 아내와 합하여 둘이 한 몸을 이룰지로다” (창2:24)라는 말씀입니다. 하나님의 주례사는 첫째로, ‘남자가 부모를 떠나’라는 말씀인데, 이것은 효도하지 말라는 것이 아니고 온전한 독립을 이루라는 말씀입니다. 둘째로 ‘아내와 합하여’라는 말씀은 두 사람 사이에 전적인, 취소할 수 없는 ‘위탁’의 의미를 내포하고 있습니다. 셋째로, ‘한 몸을 이룰지로다’라는 말씀은 육체적인 연합만이 아니라 인식이나 가치관, 감정 등 모든 면에 하나가 되는 것을 의미합니다. 하나님의 주례사를 잘 따르면 남편과 아내의 관계가 건강해지는 것이고, 이렇게 가정의 중심축이 건강해지면 가정 전체가 참 건강하고 행복하게 되는 것입니다.\n\n가정의 원리 가운데 또 하나 참 중요한 것은 ‘돕는 배필’ (창2:18)의 표현을 따라 온 가족이 서로 ‘돕는 가족’이 되어야 하는 것입니다. 자아존중감을 도와주고, 감정적으로 도와주고, 좋은 말로 도와주고, 노동적으로 도와주고, 신앙으로 잘 도와주면 우리는 가정 안에서 힘을 얻고 용기를 얻고 참된 안식을 얻게 되는 것입니다. 이렇게 서로 ‘돕는 가족’이 되어 오고 오는 세대에 날마다 아름다운 명품 가문을 꼭 이루시기를 간절히 기원합니다.", "reflection": {"case": "저녁 식사 후 배우자가 피곤하다고 말하는데 나는 휴대전화만 보며 쉬고 싶습니다. 배우자의 피곤함을 먼저 인정하고 설거지를 맡으며 오늘 있었던 일을 들어줍니다.", "question": "나는 배우자의 감정과 수고를 충분히 살피고 있는가? 최근 내 편의를 앞세운 순간은 언제였는가?", "answer": "배우자가 집안일로 힘들다고 했을 때 나도 피곤하다는 말부터 했습니다. 오늘은 변명보다 공감하는 말을 먼저 하고 집안일을 함께하겠습니다.", "practice": "오늘 배우자에게 고마운 점 한 가지를 구체적으로 말하고 집안일 하나를 자발적으로 맡습니다. 잠들기 전 서로의 기도 제목을 듣습니다.", "prayer": "하나님, 가정을 주심에 감사합니다. 제 편의보다 가족의 마음을 살피고 말과 행동으로 서로 돕게 하소서. 부부가 서로 존중하며 믿음 안에서 함께 자라게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 4, "title": "아담아 네가 어디 있느냐", "scripture": "창세기 3:1~13", "body": "사람들은 영적으로 살기도 하고, 육적으로 살기도 합니다. 육적으로 사는 것은 물질세계가 전부라고 생각해서 오직 육체적인 만족만을 위해 사는 삶을 말합니다. 그래서 돈 많이 벌고, 재미있고, 즐겁게 사는 것이 육적인 사람들의 목적입니다. 하지만 영적으로 사는 것은 물질을 넘어 영의 세계가 있음을 확신하고, 우리를 만드신 하나님의 뜻을 따라 살아가는 삶입니다. 영적인 삶이야말로 창조질서에 합당한 삶이며, 우리의 본래적인 삶입니다.\n\n그토록 아름답게 창조되었던 첫 사람 아담과 하와는 사탄의 유혹을 이기지 못하고 먹음직도 하고 보암직도 하고 탐스럽기도 한 선악과를 따먹고는 그만 타락해버리고 말았습니다. 선악과는 하나님께서 너는 피조물임을 알고, 자유의지를 갖고 전인적인 교제를 하자고 주신 것인데 아담과 하와는 스스로 인간이기를 포기하고, 자유의지를 남용하여 육적인 존재로 전락해버렸습니다. 그 결과 모든 친밀한 관계는 다 깨어지고 우리 가운데 죽음이 임하였습니다.\n\n그러나 하나님은 이렇게 타락하여 육적인 존재가 되어버린 인간을 결코 포기하지 아니하시고 예수님을 보내주셔서 다시 영적인 존재로 복원시켜 주셨습니다(창3:15). 영적인 삶이란 세상을 포기하고, 재미없고, 고리타분한 삶이 절대로 아닙니다. 영적인 삶은 우리의 본래적인 삶이며, 가장 충만하고, 가장 보람 있는 삶입니다. 무엇보다 삶의 이유가 분명하고, 목적이 있는 삶이며, 천국에까지 이어지는 삶입니다. 부디 영적인 삶을 꼭 살아가시기 바랍니다.", "reflection": {"case": "가족과 함께 저녁을 먹는 중에도 수익과 돈 걱정 때문에 휴대전화만 확인하다가 배우자의 이야기를 건성으로 듣고 짜증을 냅니다. 이후 자신의 태도를 돌아보고 하나님이 기뻐하실 선택이 무엇인지 생각합니다.", "question": "최근 내 만족이나 이익을 앞세워 하나님과 가족과의 관계를 소홀히 한 순간은 언제였습니까?", "answer": "수익이 나지 않아 마음이 불편하다는 이유로 가족에게 짜증을 냈습니다. 돈을 버는 일 자체보다 그것을 대하는 제 태도가 문제였습니다. 하나님 앞에 제 욕심을 인정하고 가족에게 사과하겠습니다.", "practice": "오늘 저녁 식사 중 휴대전화를 내려놓고 가족의 이야기를 끝까지 듣습니다. 잠들기 전 내 선택을 돌아보며 5분간 기도합니다.", "prayer": "하나님, 제 만족만을 앞세웠던 마음을 고백합니다. 예수님을 통해 주신 은혜를 기억하고 제 자유를 사랑과 섬김을 위해 사용하게 하소서. 오늘의 선택 속에서 주님의 뜻을 따르게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 5, "title": "네 아우 아벨이 어디 있느냐", "scripture": "창세기 4:1~15", "body": "아담과 하와는 타락한 이후 에덴동산 동편으로 쫓겨나 살게 되었습니다. 그리고 그곳에서 자녀를 생산하기 시작하여 가인과 아벨을 낳았습니다. 세월이 지난 후에 둘은 하나님께 제사를 드렸는데 하나님은 아벨과 그의 제물은 받으셨으나 가인과 그의 제물은 받지 않으셨습니다. 이것은 단지 제물과 정성만의 문제가 아니라 하나님께서 그들의 삶을 보신 것입니다. 성경은 이에 대해 ‘아벨과 그의 제물’, ‘가인과 그의 제물’이라고 분명히 표현하고 있습니다.\n\n이 일로 가인은 분하여 안색이 변하였는데 하나님의 사랑의 충고를 받아들이지 않고 결국 아우 아벨을 쳐 죽이고 말았습니다. 죄악이 고질적으로 증가하여 이제는 형제가 형제를 죽이는 존재가 되고 만 것입니다. 이때 하나님은 가인을 찾아오셔서 ‘네 아우 아벨이 어디 있느냐’라고 질문하시는데, 이 질문은 오늘 우리에게 하나님 사랑 이웃 사랑의 위대한 계명을 떠올려주고, 연약한 아벨을 잘 돌보아야 한다는 사실을 깨닫게 해주고 있습니다.\n\n존 스타인벡의 소설 ‘에덴의 동쪽’은 창세기 3~4장에서 모티브를 따와 죄악으로 인해 고통받는 인간소외의 현실을 잘 묘사하고 있습니다. 3대에 걸친 인간 실존의 모습을 그리다가 마지막 부분에 와서 아버지 애덤은 아들 칼에게 ‘팀살’이란 단어를 남기고 숨을 거둡니다. ‘팀살’은 창세기 4장 7절에 나오는 말로써 ‘너는 죄를 다스려야 한다’는 하나님의 사랑의 충고입니다. 오늘날 삶의 현장에서 우리는 진실로 하나님의 사랑의 충고를 온몸으로 받아들여서 죄를 잘 다스리고 선을 택할 줄 알아야 하겠습니다.", "reflection": {"case": "교회에서 함께 봉사하는 사람이 내 의견을 받아들이지 않고 다른 사람의 의견만 칭찬할 때, 서운함 때문에 그 사람을 험담하고 싶어지는 상황입니다.", "question": "최근 질투나 분노 때문에 누군가에게 차갑게 대하거나 도움이 필요한 사람을 외면한 적이 있습니까?", "answer": "제 의견이 받아들여지지 않아 상대의 잘못만 찾았습니다. 제 안의 질투를 인정하고 상대를 험담하는 대신 먼저 인사하고 그의 이야기를 듣겠습니다.", "practice": "오늘 불편한 사람에게 먼저 인사하고, 도움이 필요한 이웃 한 사람에게 안부를 묻습니다. 화가 날 때는 말을 하기 전에 잠시 멈추고 기도합니다.", "prayer": "하나님, 제 안의 질투와 분노를 깨닫고 다스리게 하소서. 연약한 이웃을 외면하지 않고 사랑으로 돌보며 선을 선택하게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 6, "title": "내가 그것들을 지었음을 한탄함이니라", "scripture": "창세기 6:1~8", "body": "우리 사람에게는 참 이상한 모습이 한 가지 있는 것 같습니다. 그것은 이 세상 모든 사람들이 다 행복하기를 그토록 바라는데, 그런데 그렇게 바라면서도 행복의 길은 잘 걸어가지 않는다는 점입니다. 행복한 삶이란 결코 투기로 얻어지는 것이 아니라, 묵묵히 행복의 길을 걸어갈 때 얻게 되는 자연스런 결과물입니다. 단언컨대 사람이 살아갈 때 가장 행복한 삶은 우리를 만드신 하나님과 교제하며 그분의 뜻을 따라 살아가는 삶입니다.\n\n노아시대 사람들은 이와 같은 행복의 길을 애써 벗어나, 고질적인 죄악 속에 빠짐으로 말미암아 하나님이 탄식하실 수밖에 없는 지경에 이르렀습니다. 심지어 경건한 셋의 후손들마저 불경건한 가인의 후손들과 함께 뒤섞여 모든 인류 전체가 죄악의 소용돌이 속에 다 빠져들고 말았습니다. 마침내 하나님은 홍수로 인간을 심판하실 수밖에 없었고, 그러나 이런 중에도 은혜를 베푸셔서 하나님과 동행하였던 노아의 여덟 식구는 구원해 주셨습니다.\n\n그런데 노아 방주는 오직 한 척뿐이었고, 들어가는 문도 오직 하나였습니다. 그리고 이 방주를 히브리말로 ‘테바’ 라고 하는데 이 말은 구약성경에 딱 2번 쓰였고, 그 뜻은 ‘상자’ 입니다. 이 모든 것을 종합하면 노아방주는 돛도 닻도 키도 필요없는 오직 하나님의 은혜로 움직이는 상자 모양의 배였으며, 그 은혜의 방주 속으로 들어가야만 구원을 받았다는 사실입니다. 그러므로 우리도 이제 은혜의 하나님께로 돌아가야 합니다. 은혜의 하나님께로 돌아가 노아처럼 하나님의 은혜를 입고, 날마다 아름다운 구원의 삶을 살아가시기 바랍니다.", "reflection": {"case": "더 많은 돈을 벌면 행복해질 것이라 생각하여 하루 종일 수익에만 신경 쓰고, 기도와 가족과의 대화를 미루는 상황입니다.", "question": "나는 행복을 원하면서도 하나님과 교제하는 시간과 정직하고 사랑하는 삶을 뒤로 미루고 있지는 않습니까?", "answer": "수익에 대한 걱정 때문에 기도를 미루고 가족에게 무심했습니다. 결과만 좇기보다 하나님의 은혜를 구하며 오늘 맡은 일을 성실하게 하겠습니다.", "practice": "오늘 10분간 말씀을 읽고 기도하며, 가족과 휴대전화 없이 대화하는 시간을 갖습니다.", "prayer": "은혜의 하나님, 제 욕심을 돌아보고 주님께로 돌아가게 하소서. 노아처럼 주님과 동행하며 정직과 사랑을 실천하게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 7, "title": "그들을 온 지면에 흩으셨더라", "scripture": "창세기 11:1~9", "body": "사람은 누구에게나 ‘높이에 대한 갈망’ 이 있습니다. 더 높아지려 하고, 더 많이 가지려 하고, 더 큰 권세와 명예를 얻으려 하는 갈망은 누구에게나 있는 것이 사실입니다. 이러한 갈망이 잘못되었다고 단적으로 말할 수는 없지만 그러나 우리 인생 전체를 두고 볼 때에 오직 이러한 높이에 대한 갈망으로만 살아간다면 이것은 정말 허무한 일이 아닐 수 없습니다. 왜냐하면 높이에 대한 갈망으로 추구하는 그 모든 것은 다 지나가는 것이기 때문입니다.\n\n노아 이후 번성한 인간들은 4가지를 실행에 옮기며 하나님을 대적하였습니다. 우리끼리 성읍을 건설하고(도시문명), 탑을 높이 쌓아 하늘에 닿게 하고(과학기술문명), 하나님 없이 우리 스스로 이름을 짓고(교만), 그래서 흩어지지 말고 우리끼리 한번 잘 살아보자(사회성)고 하였습니다. 이것은 하나님 없는 문명을 건설하자는 것이었고, 이렇게 교만하고 악한 인간의 도모를 보시고 하나님은 그들의 언어를 혼잡케 하심으로 온 지면에 흩어버리셨습니다. 그래서 바벨탑 사건은 하나님 없는 역사는 반드시 실패할 수밖에 없음을 보여주고 있습니다.\n\n기독교는 결코 반문명적이지는 않습니다. 그래서 바벨탑이 무너졌다는 이야기는 성경에 등장하지 않습니다. 그러나 지금의 내 인생이 오직 높이에 대한 갈망만으로 바벨탑을 쌓는 인생이 아닌지는 깊이 돌아보아야 합니다. 우리의 인생은 오직 유일회적인 너무나 소중한 삶인데, 지나가는 것들에 우리의 인생을 걸어서는 안되겠습니다. 지나가는 것들만 붙들고 결코 허무한 인생을 살지 말고, 하나님과 더불어 영원에 잇대어 살아가시기 바랍니다.", "reflection": {"case": "교회에서 봉사를 맡았는데 다른 사람이 더 인정받는 모습을 보고 서운해져, 봉사의 목적보다 내 이름을 알리는 데 마음이 쏠리는 상황입니다.", "question": "내가 이루려는 목표는 하나님을 섬기기 위한 것인가, 아니면 나의 이름과 지위를 높이기 위한 것인가?", "answer": "봉사를 하면서도 사람들이 제 수고를 알아주기를 바랐습니다. 인정받지 못해도 기쁘게 섬기고 다른 사람의 수고를 인정하겠습니다.", "practice": "오늘 아무도 알아주지 않아도 할 수 있는 작은 섬김 한 가지를 실천하고, 저녁에 그 동기를 돌아봅니다.", "prayer": "하나님, 제 이름을 높이려는 교만을 내려놓게 하소서. 세상의 성취를 삶의 전부로 삼지 않고 주님과 동행하며 영원한 가치를 따라 살게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 8, "title": "내가 네게 보여 줄 땅으로 가라", "scripture": "창세기 12:1~9", "body": "인간의 삶에서 너무 현실에 집착하지 아니하고 초연할 줄 아는 자세는 참 중요한 삶의 태도가 아닐 수 없습니다. 왜냐하면 사람이 너무 현실적이 되면 큰 그림 속에서 내가 왜 사는지에 대한 목적의식이 사라지기 때문입니다. 특별히 이것은 신앙의 삶을 살아갈 때는 더더욱 중요한 의미로 부딪혀 옵니다. 우리의 신앙이 현실에 뿌리박은 영성이어야 하지만, 우리 인생 전체를 두고 볼 때는 장차 천국에 대한 소망을 반드시 전제로 하기 때문입니다.\n\n하나님께서 아브람을 부르실 때 그 첫 번째 말씀은 ‘떠나’, ‘가라’는 말씀이었습니다. 우리 신앙의 삶에서 ‘떠나’, ‘가는’ 것은 너무나 중요한 개념입니다. 이것을 가리켜서 신앙의 ‘나그네성’이라고 말할 수 있습니다. 우리는 진실로 길 가는 나그네입니다. 나그네는 가지지 아니하고, 집착하지 아니하고, 이 세상에 연연해하지 않습니다. 나그네는 오직 천국을 향해 묵묵히 자기 길을 걸어갈 뿐입니다. 바로 이 ‘나그네성’을 회복하면 오히려 자유롭고, 가장 본질적이 되며, 진정으로 아름다운 인생길을 걸어갈 수 있습니다.\n\n그런데 아브람이 이렇게 떠나 갈 수 있었던 것은 하나님의 약속 때문입니다. 하나님은 약속하시고, 약속하신 것을 반드시 성취하시는 하나님이심을 분명히 믿었기에 아브람은 떠나 갈 수 있었습니다. 이렇게 ‘떠나’, ‘가는’ 것이 바로 순종이며, 순종은 신구약 성경을 도도히 흐르는 가장 중요한 핵심 신앙정신입니다. 진실로 하나님의 약속을 부여잡고, 신앙의 나그네성을 회복하여, 떠나 감으로서 가장 아름답고 본질적인 삶을 살아가시기를 기원합니다.", "reflection": {"case": "재정 걱정 때문에 하루 종일 계좌를 확인하며 가족과의 약속과 기도를 미루는 상황입니다.", "question": "나는 무엇에 지나치게 집착하고 있으며 하나님의 약속을 믿고 어떤 작은 순종을 시작할 수 있는가?", "answer": "경제적 안정만 있으면 평안할 것이라고 생각했습니다. 필요한 재정 관리는 성실히 하되 결과에 매달리지 않고 가족과의 약속을 지키며 기도하겠습니다.", "practice": "오늘 불필요한 계좌 확인을 한 번 줄이고 그 시간에 말씀을 읽고 가족과 대화합니다.", "prayer": "하나님, 세상의 소유와 성취에 지나치게 집착하지 않게 하소서. 아브람처럼 주님의 약속을 믿고 오늘 맡겨진 자리에서 순종하며 천국의 소망을 품고 살아가게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 9, "title": "네 자손이 이와 같으리라", "scripture": "창세기 15:1~11", "body": "알퐁스 도데의 <별>에서 목동은 다음과 같은 말을 합니다. “만일 한번만이라도 한데서 밤을 새워 본 일이 있는 사람이라면 인간이 모두 잠든 깊은 밤중에는 또 다른 신비의 세계가 고독과 적막 속에 눈을 뜬다는 것을 알고 있을 것입니다.” 그렇습니다. 여러분은 언제 하늘의 별을 쳐다보았습니까? 혹시 힘들고 지친 삶 속에서 그저 땅만 바라보며 살아가고 있는 것은 아닙니까? 진실로 지금은 눈을 들어 하늘의 별을 바라볼 때입니다.\n\n아브람은 하나님의 약속을 받았지만 현실의 상황은 그저 모든 것이 다 불가능한 상황인지라 이리저리 흔들리는 삶을 살아갈 수밖에 없었습니다. 하지만 하나님은 아브람을 결코 포기하지 아니하시고 잊을 만하면 생각나게 하시고, 곁길로 가면 바로 잡아주셔서, 아브람을 아브라함으로 바꾸어 나가셨습니다. 특별히 하나님은 아브람을 밖으로 불러내셔서 밤하늘의 별을 보여주시면서 너의 자손이 이와 같을 것이라고 특별교육을 시켜주셨습니다. 이에 아브람이 여호와를 믿으니 여호와께서 이를 그의 의로 여겨주셨습니다(창15:6).\n\n밤하늘에 빛나는 별은 하나님의 굳건한 약속입니다. 우리가 끊임없이 붙들어야 할 견고한 소망입니다. 지금 우리가 아무리 힘들고 어려운 중에 놓여 있어도 밤하늘의 별은 여전히 찬란히 빛나고 있음을 알아야 합니다. 진실로 밤이 깊을수록 별은 빛나는 법입니다. 그러므로 지금 우리는 눈을 들어 별을 바라보고 하나님의 약속을 다시 마음속에 새기고, 하나님의 소망을 견고하게 붙들어야 합니다. 지금도 밤하늘에 별은 찬란히 빛나고 있습니다.", "reflection": {"case": "가족의 건강 문제로 검사 결과를 기다리며 밤마다 걱정에 잠겨 아무것도 나아지지 않을 것처럼 느끼는 상황입니다.", "question": "눈앞의 어려움만 바라보느라 하나님의 약속과 소망을 잊고 있지는 않은가?", "answer": "검사 결과가 두려워 최악의 상황만 생각했습니다. 결과를 단정하지 않고 필요한 진료를 받으며 하나님께 마음을 맡기고 가족을 격려하겠습니다.", "practice": "오늘 저녁 하늘을 바라보며 창세기 15장 6절을 읽고 걱정 한 가지와 감사 한 가지를 적어 기도합니다.", "prayer": "하나님, 현실이 어렵고 마음이 흔들릴 때에도 주님의 약속을 기억하게 하소서. 두려움에 갇히지 않고 소망을 붙들며 오늘 할 수 있는 일을 성실히 하게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}, {"expected_number": 10, "title": "열 명으로 말미암아 멸하지 아니하리라", "scripture": "창세기 18:22~33", "body": "C. S. 루이스는 우리 시대를 가리켜 구도정신을 상실한 시대라고 말하였습니다. 구도정신을 상실한 구체적인 증거 중 하나는 죄에 대하여 진지하게 고민하는 현대인들이 많지 않다는 것입니다. 우리가 죄로부터 구원의 감격을 얻고 또 죄를 이기는 성숙한 모습을 갖추려고 하면 먼저 자기 죄에 대하여 아파하고 괴로워하는 ‘애통’의 모습이 있어야 합니다. 그런데 오늘날 현대인들 가운데는 그렇게 죄에 대한 민감성을 지닌 사람들이 많지 않다는 것입니다.\n\n소돔성은 완전히 구도정신을 상실한 곳이었고, 죄에 대한 민감성을 전혀 갖지 못한 곳이었습니다. 대신에 소돔성은 음란과 폭력과 각종 죄악이 가득 차 있는 곳이었습니다. 아브라함은 소돔성을 위하여 하나님께 중보하며 오십 명으로부터 시작하여 십 명까지 이르렀지만, 결국 소돔성은 의인 열 사람이 없어서 하나님의 심판을 받을 수밖에 없었습니다. 참으로 안타까운 것은 소돔성과 마찬가지로 오늘날도 이 시대는 구도정신을 상실해버렸고, 죄에 대한 민감성은 사라져버렸고, 사람들은 너무나 자연스럽게 죄악에 몰두하고 있습니다.\n\n하나님은 죄악에 대하여 반드시 심판하십니다. 그러므로 우리에게 “내 백성아, 거기서 나오라” (my people! Come out from her!)고 말씀하십니다(계18:4). 우리는 지금 당장 달콤하다고, 편안하다고, 거짓 만족에 빠져 있지 말고, 죄악으로부터 과감히 뛰쳐나와야 합니다. 신앙에 있어 ‘애통’은 참 중요합니다. 여러분은 진실로 애통의 마음으로 가지고, 이 시대에 하나님이 찾으시는 바로 그 한 사람(remnant)으로 살아가시기를 바랍니다.", "reflection": {"case": "친구들과 모인 자리에서 없는 사람의 흉을 보며 웃다가 집에 돌아와서도 대수롭지 않게 여기는 상황입니다.", "question": "다른 사람들도 한다는 이유로 내 잘못을 가볍게 여기거나 외면한 적이 있는가?", "answer": "분위기에 맞추려고 험담에 동참했습니다. 제 말이 상대에게 상처가 될 수 있음을 인정하고 하나님께 회개하겠습니다. 다음에는 대화를 다른 주제로 돌리고 그 사람을 위해 기도하겠습니다.", "practice": "오늘 무심코 반복한 잘못 한 가지를 적고 회개하며, 그 행동을 대신할 구체적인 선한 행동을 실천합니다.", "prayer": "하나님, 익숙해진 잘못을 당연하게 여기지 않게 하소서. 제 죄를 깨닫고 애통하며 돌이키게 하시고, 이웃을 위해 중보하며 정직과 사랑을 실천하게 하소서. 예수님의 이름으로 기도합니다. 아멘."}}];let current=0;const q=document.getElementById('q'),results=document.getElementById('results'),detail=document.getElementById('detail');function list(){results.replaceChildren();let s=q.value.trim().replace(/\s/g,'');for(const [i,x] of data.entries()){if(s&&!`${x.expected_number} ${x.title} ${x.scripture}`.replace(/\s/g,'').includes(s))continue;let b=document.createElement('button');b.textContent=`${x.expected_number}편 · ${x.title}`;b.onclick=()=>show(i,true);results.append(b)}}function show(i,scroll=false){current=i;let x=data[i];detail.replaceChildren();function add(tag,t){let e=document.createElement(tag);e.textContent=t;detail.append(e)}add('h2',`${x.expected_number}편 · ${x.title}`);add('strong',x.scripture);add('h3','원본 본문');add('p',x.body);for(let [k,t] of Object.entries({case:'일상생활 묵상 사례',question:'묵상 질문',answer:'답변 예시',practice:'오늘의 실천',prayer:'마무리 기도'})){add('h3',t);add('p',x.reflection[k])}add('h3','나의 묵상 기록');let a=document.createElement('textarea');a.rows=4;let key='ollam-note-'+x.expected_number;try{a.value=localStorage.getItem(key)||''}catch(e){}a.oninput=()=>{try{localStorage.setItem(key,a.value)}catch(e){}};detail.append(a);document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===data.length-1;if(scroll)detail.scrollIntoView()}q.oninput=list;document.getElementById('prev').onclick=()=>show(current-1,true);document.getElementById('next').onclick=()=>show(current+1,true);list();show(0);</script></html>
